server:
  # 避开认证服务 8081 和本地 Nacos 控制台 8080
  port: ${SERVER_PORT:8082}

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: rednote-auth
          uri: lb://rednote-auth
          predicates:
            - Path=/auth/**
          filters:
            # /auth/user/login -> 认证服务的 /user/login
            - StripPrefix=1

# Sa-Token 基础配置（与认证服务保持一致，共享 Redis 登录态）
sa-token:
  # Token 名称，同时也是请求头名称
  token-name: satoken
  # Token 有效期，单位秒，默认 30 天
  timeout: 2592000
  # 活跃超时时间，-1 表示不限制
  active-timeout: -1
  # 允许同一账号多端同时登录
  is-concurrent: true
  # 每次登录签发独立 Token
  is-share: false
  token-style: uuid
  # 是否输出 Sa-Token 操作日志
  is-log: false
