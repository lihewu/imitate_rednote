server:
  port: 8080 # 应用服务 WEB 访问端口

# 阿里云号码认证短信：使用控制台赠送的配套签名和模板，模板变量为 code、min。
sms:
  aliyun:
    enabled: ${ALIYUN_SMS_ENABLED:false}
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:}
    template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}

spring:
  profiles:
    active: dev # 默认激活 dev 开发环境

mybatis:
  # MyBatis XML 文件所在位置
  mapper-locations: classpath:/mapper/**/*.xml

# Sa-Token 基础配置
sa-token:
  # Token 名称，同时也是请求头和 Cookie 名称
  token-name: satoken
  # Token 有效期，单位秒，默认 30 天
  timeout: 2592000
  # 活跃超时时间，-1 表示不限制
  active-timeout: -1
  # 允许同一账号多端同时登录
  is-concurrent: true
  # 每次登录签发独立 Token
  is-share: false
  token-style: uuid
  # 是否输出 Sa-Token 操作日志
  is-log: false
