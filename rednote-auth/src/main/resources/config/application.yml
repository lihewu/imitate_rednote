server:
  port: ${SERVER_PORT:8081} # 避免与 Nacos 控制台的 8080 端口冲突

# 阿里云号码认证短信：使用控制台赠送的配套签名和模板，模板变量为 code、min。
sms:
  aliyun:
    enabled: ${ALIYUN_SMS_ENABLED:false}
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:}
    template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}

# 可在 Nacos 中覆盖；sms：短信告警，mail：邮件告警
alarm:
  type: sms

spring:
  application:
    name: rednote-auth
  profiles:
    active: dev # 默认激活 dev 开发环境
  config:
    # 必须成功读取配置中心；Data ID 默认是 rednote-auth-dev.yml
    import:
      - "nacos:${spring.application.name}-${spring.profiles.active}.yml?refreshEnabled=true"
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD}
        # 填写命名空间 ID，可通过环境变量覆盖
        namespace: ${NACOS_NAMESPACE:rednote}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yml
      discovery:
        enabled: true # 启用服务发现
        group: DEFAULT_GROUP # 所属组
        namespace: rednote # 命名空间 ID
        server-addr: 127.0.0.1:8848 # Nacos 注册中心地址
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD}

mybatis:
  # MyBatis XML 文件所在位置
  mapper-locations: classpath:/mapper/**/*.xml

# Sa-Token 基础配置
sa-token:
  # Token 名称，同时也是请求头和 Cookie 名称
  token-name: satoken
  # Token 有效期，单位秒，默认 30 天
  timeout: 2592000
  # 活跃超时时间，-1 表示不限制
  active-timeout: -1
  # 允许同一账号多端同时登录
  is-concurrent: true
  # 每次登录签发独立 Token
  is-share: false
  token-style: uuid
  # 是否输出 Sa-Token 操作日志
  is-log: false
